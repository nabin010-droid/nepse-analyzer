name: Update NEPSE data
on:
  schedule:
    - cron: "30 9 * * 0-4"   # 15:15 NST, Sun-Thu (bazaar band bhaepachhi)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nepseman-api
      - run: python fetch_nepse.py
      - name: Commit data.json
        run: |
          git config user.name "nepse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "data $(date -u +%F)" && git push)
