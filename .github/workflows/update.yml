# Save as .github/workflows/update.yml
name: update-data
on:
  schedule:
    - cron: "30 13 * * 0-5"   # daily except Saturday, ~7:15pm Nepal time (source dataset updates 5:45pm NPT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests feedparser
      - run: python update_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.json && git commit -m "daily update" || echo "no change"
          git push
